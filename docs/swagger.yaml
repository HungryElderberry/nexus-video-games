basePath: /
definitions:
  nexus-video-games_internal_model.ActiveSessionResponse:
    properties:
      expires_at:
        type: string
      external_game_id:
        type: string
      games_owned_id:
        type: string
      seconds_left:
        type: integer
      started_at:
        type: string
      user_id:
        type: string
    type: object
  nexus-video-games_internal_model.BalanceResponse:
    properties:
      balance_amount:
        type: integer
      currency:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  nexus-video-games_internal_model.BuyGameRequest:
    properties:
      external_game_id:
        type: string
    required:
    - external_game_id
    type: object
  nexus-video-games_internal_model.DashboardStatsResponse:
    properties:
      currency:
        type: string
      current_balance:
        type: integer
      monthly_cash_spent:
        type: integer
      monthly_games_played:
        items:
          $ref: '#/definitions/nexus-video-games_internal_model.MonthlyGamePlayResponse'
        type: array
      total_cash_spent:
        type: integer
      total_games_owned:
        type: integer
    type: object
  nexus-video-games_internal_model.GameCatalogItemResponse:
    properties:
      external_game_id:
        type: string
      is_available:
        type: boolean
      price_in_balance:
        type: integer
      title:
        type: string
    type: object
  nexus-video-games_internal_model.LaunchGameResponse:
    properties:
      expires_at:
        type: string
      game_title:
        type: string
      message:
        type: string
      redirect_url:
        type: string
      session_id:
        type: string
    type: object
  nexus-video-games_internal_model.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/nexus-video-games_internal_model.UserResponse'
    type: object
  nexus-video-games_internal_model.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  nexus-video-games_internal_model.MonthlyGamePlayResponse:
    properties:
      external_game_id:
        type: string
      playtime_minutes:
        type: integer
      title:
        type: string
    type: object
  nexus-video-games_internal_model.RegisterUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  nexus-video-games_internal_model.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 100
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  nexus-video-games_internal_model.TopupBalanceRequest:
    properties:
      amount:
        description: Minimum Topup IDR 10k
        minimum: 10000
        type: integer
    required:
    - amount
    type: object
  nexus-video-games_internal_model.TopupResponse:
    properties:
      amount:
        type: integer
      checkout_url:
        type: string
      created_at:
        type: string
      invoice_id:
        type: string
      status:
        type: string
    type: object
  nexus-video-games_internal_model.UserGameLibraryResponse:
    properties:
      acquired_at:
        type: string
      external_game_id:
        type: string
      id:
        type: string
      playtime_minutes:
        type: integer
      title:
        type: string
    type: object
  nexus-video-games_internal_model.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
    type: object
  nexus-video-games_internal_model.WebResponse-any:
    properties:
      data: {}
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-array_nexus-video-games_internal_model_GameCatalogItemResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/nexus-video-games_internal_model.GameCatalogItemResponse'
        type: array
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-array_nexus-video-games_internal_model_UserGameLibraryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/nexus-video-games_internal_model.UserGameLibraryResponse'
        type: array
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_ActiveSessionResponse:
    properties:
      data:
        $ref: '#/definitions/nexus-video-games_internal_model.ActiveSessionResponse'
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_BalanceResponse:
    properties:
      data:
        $ref: '#/definitions/nexus-video-games_internal_model.BalanceResponse'
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_DashboardStatsResponse:
    properties:
      data:
        $ref: '#/definitions/nexus-video-games_internal_model.DashboardStatsResponse'
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_LaunchGameResponse:
    properties:
      data:
        $ref: '#/definitions/nexus-video-games_internal_model.LaunchGameResponse'
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_LoginResponse:
    properties:
      data:
        $ref: '#/definitions/nexus-video-games_internal_model.LoginResponse'
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_TopupResponse:
    properties:
      data:
        $ref: '#/definitions/nexus-video-games_internal_model.TopupResponse'
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_UserResponse:
    properties:
      data:
        $ref: '#/definitions/nexus-video-games_internal_model.UserResponse'
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.WebResponse-string:
    properties:
      data:
        type: string
      errors:
        type: string
    type: object
  nexus-video-games_internal_model.XenditInvoiceWebhookPayload:
    properties:
      external_id:
        type: string
      id:
        type: string
      paid_amount:
        type: integer
      payer_email:
        type: string
      payment_method:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: High-performance backend API featuring video games catalog, in-game
    wallet, Xendit payment gateway, Resend email alerts, and single-game session enforcement.
  title: Nexus Video Games REST API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Logs into account, returns Bearer token, and triggers security
        notification email.
      parameters:
      - description: User Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nexus-video-games_internal_model.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      summary: Authenticate user and generate JWT
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      description: Invalidates client-side session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-string'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Sign out of the system
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user record and dispatches an email verification
        link via Resend.
      parameters:
      - description: User Registration Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nexus-video-games_internal_model.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      summary: Register a new user account
      tags:
      - Authentication
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using the reset token provided in the login
        notification email.
      parameters:
      - description: Password Reset Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nexus-video-games_internal_model.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      summary: Reset forgotten or compromised password
      tags:
      - Authentication
  /api/v1/auth/verify:
    get:
      description: Validates the email token clicked from the Resend email message.
      parameters:
      - description: Email verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      summary: Verify user email address
      tags:
      - Authentication
  /api/v1/balances:
    get:
      description: Returns wallet amount in minor units (IDR) for the authenticated
        player.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_BalanceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Get current in-game wallet balance
      tags:
      - Balances & Payments
  /api/v1/balances/topup:
    post:
      consumes:
      - application/json
      description: Generates a checkout URL where the player can simulate or complete
        payment.
      parameters:
      - description: Top-up Amount
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nexus-video-games_internal_model.TopupBalanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_TopupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Create Xendit invoice for wallet top-up
      tags:
      - Balances & Payments
  /api/v1/dashboard:
    get:
      description: Calculates user wallet balance, owned games count, lifetime spending,
        monthly spending, and games played in the current month.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_DashboardStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Get player dashboard metrics
      tags:
      - Dashboard
  /api/v1/games/buy:
    post:
      consumes:
      - application/json
      description: Deducts game price from user wallet and grants game ownership.
      parameters:
      - description: External Game ID to purchase
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/nexus-video-games_internal_model.BuyGameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Purchase a game using wallet balance
      tags:
      - Games
  /api/v1/games/explore:
    get:
      description: Retrieves games cached from IsThereAnyDeal available for wallet
        purchase.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-array_nexus-video-games_internal_model_GameCatalogItemResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      summary: List all available games in catalog
      tags:
      - Games
  /api/v1/games/library:
    get:
      description: Lists all acquired games along with logged playtime.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-array_nexus-video-games_internal_model_UserGameLibraryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Get games owned by authenticated user
      tags:
      - Games
  /api/v1/games/sync:
    post:
      description: Pulls live game deals and upserts records into PostgreSQL games_catalog.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-string'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Synchronize catalog from IsThereAnyDeal API
      tags:
      - Games
  /api/v1/sessions/active:
    get:
      description: Returns details of the currently running session and countdown
        to expiry.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_ActiveSessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Check current active playing session
      tags:
      - Game Sessions
  /api/v1/sessions/launch/{game_id}:
    post:
      description: Verifies ownership, enforces single-game active session rule (with
        60-second auto-expiry), and provides game redirect route.
      parameters:
      - description: External Game ID
        in: path
        name: game_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_LaunchGameResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Launch a game and start active playing session
      tags:
      - Game Sessions
  /api/v1/users/me:
    get:
      description: Fetches the profile details of the user identified by the Bearer
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-nexus-video-games_internal_model_UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Get current authenticated user profile
      tags:
      - Authentication
  /api/v1/webhooks/xendit:
    post:
      consumes:
      - application/json
      description: Processes payment settlement notifications, credits player wallet,
        and triggers email receipt.
      parameters:
      - description: Xendit Webhook Verification Token
        in: header
        name: x-callback-token
        type: string
      - description: Xendit Webhook Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/nexus-video-games_internal_model.XenditInvoiceWebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-any'
      summary: Handle incoming payment webhooks from Xendit
      tags:
      - Balances & Payments
  /games/{slug}:
    get:
      description: Destination route for game launching.
      parameters:
      - description: Game Slug / External Game ID
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus-video-games_internal_model.WebResponse-string'
      summary: Simulated game streaming route
      tags:
      - Game Sessions
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter your token with the format: Bearer <your_jwt_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
